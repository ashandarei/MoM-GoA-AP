name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Validate controller layouts and result reader
        run: python -m unittest discover -s tests -v
      - name: Validate USB/Bluetooth reports and completion exit
        run: dotnet run --project tests/CompletionExit.Tests.csproj -c Release
